# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e66332bf6435a86897a4e1c93f8ee00d"
name = "HidePayment"
application_url = "https://payment-rules-pro-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
scopes = "write_payment_customizations,read_payment_customizations,read_products"

[auth]
redirect_urls = [
  "https://payment-rules-pro-production.up.railway.app/auth/callback",
  "https://payment-rules-pro-production.up.railway.app/auth/shopify/callback",
]
