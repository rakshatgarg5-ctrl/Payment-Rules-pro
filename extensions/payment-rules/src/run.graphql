query RunInput($tags_list: [String!]! = [], $collection_ids: [ID!]! = []) {
  cart {
    cost {
      totalAmount {
        amount
        currencyCode
      }
      subtotalAmount {
        amount
      }
    }
    buyerIdentity {
      customer {
        hasTags(tags: $tags_list) {
          hasTag
          tag
        }
      }
    }
    deliveryGroups {
      deliveryAddress {
        countryCode
        provinceCode
        zip
        city
        address1
      }
      selectedDeliveryOption {
        title
        handle
        code
        deliveryMethodType
      }
    }
    lines {
      quantity
      merchandise {
        ... on ProductVariant {
          sku
          weight
          weightUnit
          requiresShipping
          product {
            id
            vendor
            inCollections(ids: $collection_ids) {
              collectionId
              isMember
            }
          }
        }
      }
    }
  }
  paymentMethods {
    id
    name
  }
  paymentCustomization {
    metafield(namespace: "$app:payment-rules", key: "function-configuration") {
      value
    }
  }
}
